name: aula-postgresql
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: alumno
      POSTGRES_PASSWORD: alumno
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumno -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
volumes:
  datos_postgres:
