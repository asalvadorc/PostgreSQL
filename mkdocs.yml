    - index.md
    - RA y CE: RA_CE.md
    - 1. Introducción: BD_PostgreSQL_DQL/1_introducci.md
    - 2. PostgreSQL con Docker Compose: entorno_postgresql.md
    - 3. Conectar desde DBeaver: BD_PostgreSQL_DQL/2_client_dbeaver_installaci_i_confiuraci.md
    - 4. Bases de datos de ejemplo:
      - 📖 Presentación: bases_datos.md
      - 📱 Moviles: BD_PostgreSQL_DQL/3_dades_dels_exemples_i_els_exercicis.md
      - 🎮 Juegos: BD_PostgreSQL_DQL/juegos.md
